title: "Shixian Liu"
description: "Personal academic website on thermophysics and phonon transport"
url: "https://sxliu.site"
baseurl: ""
lang: en
timezone: Europe/Moscow
markdown: kramdown

author:
  name: "Shixian Liu"
  url: "https://sxliu.site"
  links:
    - "https://scholar.google.com/citations?user=bLVSRuUAAAAJ"
    - "https://orcid.org/0000-0003-3042-7817"
    - "https://github.com/lyushisyan"

social:
  name: "Shixian Liu"
  links:
    - "https://scholar.google.com/citations?user=bLVSRuUAAAAJ"
    - "https://orcid.org/0000-0003-3042-7817"
    - "https://github.com/lyushisyan"

logo: "/assets/img/profile/favicon.png"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed
  sass_dir: _sass

nav:
  - title: About
    url: /
  - title: News
    url: /news/
  - title: Publications
    url: /publications/
  - title: Software
    url: /software/
  - title: Teaching
    url: /teaching/
  - title: CV
    url: /cv/

# Retain blog sources for reference without publishing them.
exclude:
  - _posts
  - blog.md
  - zh-blog.md
  - assets/css/components/blog.css
  - assets/css/components/post.css
  - tmp
  - assets/teaching/python/Lecture_01_ZH.pdf
  - assets/teaching/python/Lecture_02_ZH.pdf
  - assets/teaching/python/Lecture_03_ZH.pdf

defaults:
  - scope:
      path: ""
    values:
      layout: page

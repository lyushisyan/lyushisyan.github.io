- name: "NEP-kappa"
  category: "Phonon workflow"
  version: "v2.0.1"
  language: "Python 3.10+"
  logo: "/assets/img/software/NEP-kappa-logo-880x740.png"
  tagline: "From atomic forces to equilibrium and nonequilibrium phonon transport."
  summary: >-
    A YAML-driven framework that links first-principles and machine-learning force models
    to finite-temperature phonons, lattice thermal transport, and nonequilibrium dynamics.
  description: >-
    NEP-kappa 2.0 connects NEP, VASP, MACE, and ASE calculators to a reproducible workflow
    for force constants, phonon properties, thermal-conductivity calculations, and
    time-dependent phonon simulations. The same input structure can organize calculations
    from harmonic lattice dynamics to temperature-renormalized and higher-order transport.
  capabilities:
    - "Harmonic phonons and force constants from first-principles or machine-learning potentials"
    - "Quasi-harmonic and stochastic self-consistent phonon treatments at finite temperature"
    - "Three- and four-phonon transport with RTA, LBTE, and Wigner formulations"
    - "Mode-resolved time-dependent BTE simulations of nonequilibrium thermalization"
  best_for: >-
    Reproducible lattice-thermal-transport studies, force-model comparisons, finite-temperature
    phonon renormalization, and mode-resolved relaxation dynamics.
  quick_start: "nepkappa run input.yaml"
  status: "Open source"
  tags:
    - "NEP / VASP / MACE"
    - "3ph + 4ph transport"
    - "QHA + SSCHA"
    - "TD-BTE"
  link: "https://github.com/lyushisyan/NEP-kappa"
  docs: "https://nep-kappa.readthedocs.io"
  papers:
    - label: "NEP-kappa 2.0 paper"
      url: "https://doi.org/10.48550/arXiv.2610.25477"
    - label: "Method paper"
      url: "https://doi.org/10.1063/5.0324012"

- name: "PhonoMC"
  category: "Monte Carlo solver"
  language: "C++17 / OpenMP"
  logo: "/assets/img/software/PhonoMC-logo.png"
  tagline: "Mode-resolved Monte Carlo simulation of nanoscale heat transport."
  summary: >-
    A C++17 deviational phonon Monte Carlo solver for thin films, interfaces, and device
    geometries with fixed or locally temperature-dependent scattering.
  description: >-
    PhonoMC imports full-Brillouin-zone phonon data and follows computational carriers through
    nanoscale structures. It supports full-distribution and deviational formulations, local
    temperature reconstruction, energy-conserving collision updates, spectrum-selective heating,
    and heat flow across boundaries and material interfaces.
  capabilities:
    - "Cross-plane, finite in-plane, and periodic-gradient transport in thin films"
    - "RTA and Callaway collisions with fixed or locally evaluated scattering rates"
    - "Box, STL, and OBJ geometries with rough, periodic, and thermal-reservoir boundaries"
    - "DMM, AMM, and mixed interfaces plus localized and frequency-selective heat sources"
  best_for: >-
    Nondiffusive heat transport in semiconductor films and devices, hotspot simulations,
    interfacial transport, and targeted phonon-excitation studies.
  quick_start: "./build/PhonoMC path/to/input.toml"
  status: "Open source"
  tags:
    - "Deviational Monte Carlo"
    - "Temperature-dependent scattering"
    - "Device geometry"
    - "OpenMP"
  link: "https://github.com/lyushisyan/PhonoMC"
  docs: "https://phonomc.readthedocs.io/"
  papers:
    - label: "PhonoMC paper"
      url: "https://doi.org/10.48550/arXiv.2609.21884"

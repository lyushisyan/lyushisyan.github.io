<!doctype html>
<html data-theme="light" lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <script>
      try {
        if (localStorage.getItem('site-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (_) {}
    </script>
    <link rel="icon" type="image/png" href="{{ '/assets/img/profile/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/img/profile/favicon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% if page.extra_css %}
      {% for css_path in page.extra_css %}
        <link rel="stylesheet" href="{{ css_path | relative_url }}?v={{ site.time | date: '%s' }}">
      {% endfor %}
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include site-sidebar.html %}
    <div class="site-body">
      <header class="site-toolbar" aria-label="Display settings">
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" hidden>Dark mode</button>
      </header>
      <main id="main-content" class="container content">
        {{ content }}
      </main>
      <footer class="site-footer">
        <div class="container"><p>© {{ 'now' | date: '%Y' }} {{ site.title }}.</p></div>
      </footer>
    </div>
    <script src="{{ '/assets/js/site-theme.js' | relative_url }}" defer></script>
    {% if page.math %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          tags: 'ams'
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% endif %}
  </body>
</html>
